<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Aile Festivali Sıfır Atık Vakfı Oyun Alanı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --g900:#0B3B2A; --g700:#13693F; --g500:#2E9460; --g300:#8CCBA5; --g100:#E4F2E9; --g50:#F4FAF6;
  --white:#FFFFFF; --text:#1B2A22; --muted:#5E6D65; --line:#DFE7E2;
  --font:"IBM Plex Sans", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --c0:var(--g700); --c1:var(--g300);
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--g50);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.container{max-width:1160px;margin:0 auto;padding:0 24px}

/* header */
header{background:var(--g900);color:var(--white);padding-top:env(safe-area-inset-top,0px)}
header .container{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding-top:26px;padding-bottom:26px}
.org{font-size:14px;font-weight:500;color:var(--g300);margin:0 0 6px}
h1{font-size:clamp(22px,3vw,30px);font-weight:600;margin:0;letter-spacing:-.01em;line-height:1.2}
.meta{font-size:14px;color:#CFE6D8;text-align:right}
.meta strong{display:block;color:var(--white);font-weight:600;font-size:15px}

main.container{padding-top:28px;padding-bottom:48px}
.panel{background:var(--white);border:1px solid var(--line);border-radius:8px}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(3,1fr)}
.kpi{padding:20px 24px;border-left:1px solid var(--line)}
.kpi:first-child{border-left:0}
.kpi .label{font-size:13px;color:var(--muted);margin:0}
.kpi .value{font-size:32px;font-weight:600;color:var(--g900);line-height:1.15;margin:6px 0 2px}
.kpi .note{font-size:13px;color:var(--muted)}

/* days */
.days-panel{margin-top:20px}
.days{display:grid;grid-template-columns:repeat(8,1fr);gap:14px;padding:22px}
.day{display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0}
.day .cnt{font-size:18px;font-weight:600;color:var(--g900);height:26px}
.tank{position:relative;width:100%;max-width:92px;height:170px;border:2px solid var(--g300);border-radius:10px;background:var(--g50);overflow:hidden;margin:6px 0 10px}
.fill{position:absolute;left:0;right:0;bottom:0;background:var(--g500);transition:height .8s ease}
.fill::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--g300);opacity:.9}
.day.done .tank{border-color:var(--g700)}
.day.done .fill{background:var(--g700)}
.day.waiting .tank{border-style:dashed}
.day .name{font-size:14px;font-weight:600}
.day .date{font-size:12px;color:var(--muted);margin-bottom:8px}
.status{font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.status.s-live{background:var(--g100);color:var(--g700)}
.status.s-live::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--g500);margin-right:6px;vertical-align:1px}
.status.s-done{background:var(--g700);color:var(--white)}
.status.s-wait{background:#EEF1EF;color:var(--muted)}
@media (max-width:760px){.days{grid-template-columns:repeat(4,1fr);row-gap:24px}.tank{height:130px}}

/* layout */
.row{display:grid;grid-template-columns:1.7fr 1fr;gap:20px;margin-top:20px}
.row>*{min-width:0}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 22px;border-bottom:1px solid var(--line)}
.panel-head h2{font-size:16px;font-weight:600;margin:0}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.panel-body{padding:18px 22px}
.chart{overflow-x:auto}
.chart svg{display:block;width:100%;min-width:520px;height:auto}
.chart text{font-family:var(--font);font-size:12px;fill:var(--muted)}
.chart .val{fill:var(--text);font-weight:600}
.foot{font-size:12px;color:var(--muted);margin:8px 0 0}

/* split */
.split{display:flex;height:12px;border-radius:3px;overflow:hidden;margin:4px 0 8px}
.split span{display:block;height:100%}
.split-labels{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.gtable{width:100%;border-collapse:collapse;margin-top:18px;font-size:14px}
.gtable th{font-weight:500;color:var(--muted);text-align:right;padding:8px 0 8px 10px;border-bottom:1px solid var(--line);font-size:13px}
.gtable th:first-child,.gtable td:first-child{text-align:left;padding-left:0}
.gtable td{padding:10px 0 10px 10px;text-align:right;border-bottom:1px solid var(--line)}
.gtable tr:last-child td{border-bottom:0}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:8px;vertical-align:-1px}

/* records */
.records{margin-top:20px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{font:inherit;font-size:13px;border:0;border-left:1px solid var(--line);background:var(--white);color:var(--text);padding:7px 14px;cursor:pointer}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--g700);color:var(--white)}
.search{font:inherit;font-size:13px;padding:7px 12px;border:1px solid var(--line);border-radius:6px;min-width:200px;color:var(--text)}
.seg button:focus-visible,.search:focus-visible{outline:2px solid var(--g500);outline-offset:2px}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.scroll{max-height:480px;overflow:auto}
table.list{width:100%;border-collapse:collapse;font-size:14px}
.list th{position:sticky;top:0;background:var(--g100);color:var(--g900);font-weight:600;font-size:13px;text-align:left;padding:10px 22px}
.list td{padding:10px 22px;border-bottom:1px solid var(--line)}
.list tbody tr:nth-child(even) td{background:#FAFCFB}
.list td.num{color:var(--muted)}
.empty{color:var(--muted);padding:24px 22px}
.count{font-size:13px;color:var(--muted);padding:12px 22px;border-top:1px solid var(--line)}

footer{border-top:1px solid var(--line);background:var(--white);padding-bottom:env(safe-area-inset-bottom,0px)}
footer .container{padding-top:18px;padding-bottom:18px;font-size:12px;color:var(--muted)}

@media (max-width:900px){.row{grid-template-columns:1fr}}
@media (max-width:600px){.kpis{grid-template-columns:1fr}.kpi{border-left:0;border-top:1px solid var(--line)}.kpi:first-child{border-top:0}}
@media (max-width:600px){.container{padding:0 16px}.meta{text-align:left}.kpi{padding:16px}.kpi .value{font-size:26px}
  .list th,.list td{padding:10px 14px}.list th:nth-child(4),.list td:nth-child(4){display:none}.search{width:100%}.panel-head,.panel-body{padding-left:16px;padding-right:16px}}
</style>
</head>
<body>
<header>
  <div class="container">
    <div>
      <h1>Aile Festivali Sıfır Atık Vakfı Oyun Alanı</h1>
    </div>
    <div class="meta"><strong>26 Eylül – 3 Ekim 2026</strong><span id="range"></span></div>
  </div>
</header>

<main class="container">
  <section class="panel kpis" id="kpis" aria-label="Özet göstergeler"></section>

  <section class="panel days-panel">
    <div class="panel-head"><h2>Günlük oyuncu dağılımı</h2><p class="foot" style="margin:0">8 günlük festival takvimi</p></div>
    <div class="days" id="days"></div>
  </section>

  <div class="row">
    <section class="panel">
      <div class="panel-head">
        <h2>Saatlik oyuncu sayısı</h2>
        <div class="legend"><span><i style="background:var(--c0)"></i>Bilgi Bizde</span><span><i style="background:var(--c1)"></i>Bir Bak, Bir Hatırla</span></div>
      </div>
      <div class="panel-body"><div class="chart" id="hours"></div><p class="foot" id="hoursNote"></p></div>
    </section>

    <section class="panel">
      <div class="panel-head"><h2>Oyun dağılımı</h2></div>
      <div class="panel-body" id="games"></div>
    </section>
  </div>

  <section class="panel records">
    <div class="panel-head">
      <h2>Katılımcı kayıtları</h2>
      <div class="tools">
        <div class="seg" role="group" aria-label="Oyuna göre filtrele">
          <button data-f="all" aria-pressed="true">Tümü</button>
          <button data-f="0" aria-pressed="false">Bilgi Bizde</button>
          <button data-f="1" aria-pressed="false">Bir Bak, Bir Hatırla</button>
        </div>
        <input class="search" id="q" type="search" placeholder="İsim veya numara ara" aria-label="İsim veya numara ara">
      </div>
    </div>
    <div class="scroll">
      <table class="list"><thead><tr><th>Tarih</th><th>Ad Soyad</th><th>Telefon</th><th>Oyun</th></tr></thead><tbody id="rows"></tbody></table>
    </div>
    <div class="count" id="count"></div>
  </section>
</main>

<footer><div class="container">Kaynak: Sıfır Atık Vakfı, Aile Festivali oyun alanı kayıtları.</div></footer>

const hourOf = r => +r.t.slice(0,2);

const byGame = [0,1].map(g => DATA.filter(r => r.g===g));
const hrs = DATA.map(hourOf); const hours = []; for(let h=Math.min(...hrs); h<=Math.max(...hrs); h++) hours.push(h);
const hc = [0,1].map(g => hours.map(h => byGame[g].filter(r => hourOf(r)===h).length));
const tot = hours.map((_,i) => hc[0][i]+hc[1][i]);
const peak = tot.indexOf(Math.max(...tot));
const uniq = rows => new Set(rows.map(r=>r.p)).size;
const players = new Set(DATA.map(r=>r.p));
const both = [...players].filter(p => byGame[0].some(r=>r.p===p) && byGame[1].some(r=>r.p===p)).length;
const first = DATA[0].t, last = DATA[DATA.length-1].t;

const AYLAR=["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
const lastRec=DATA[DATA.length-1];
const trDate=(iso,short)=>{const [y,m,d]=iso.split("-").map(Number);return `${d} ${short?AYLAR[m-1].slice(0,3):AYLAR[m-1]}`;};
document.getElementById("range").textContent = `Son kayıt: ${trDate(lastRec.d)}, ${lastRec.t}`;

// KPIs
const kpi = (label, value, note) => `<div class="kpi"><p class="label">${label}</p><div class="value">${value}</div>${note?`<div class="note">${note}</div>`:""}</div>`;
document.getElementById("kpis").innerHTML =
  kpi("Toplam oyuncu sayısı", fmt(DATA.length), "İki oyun toplamı") +
  kpi("İki oyunu da oynayan", fmt(both), `Tüm katılımcılar içinde %${Math.round(both/players.size*100)}`) +
  kpi("En yoğun saat", `${hours[peak]}:00`, `${tot[peak]} oyuncu`);

// Daily tanks (8 days, Istanbul time)
const FESTIVAL_BASLANGIC="2026-09-26", GUN_SAYISI=8;
const GUNLUK_HEDEF=0; // 0 = en kalabalık güne göre ölçekle; bir sayı yazılırsa doluluk bu hedefe göre hesaplanır
function addDays(iso,n){const [y,m,d]=iso.split("-").map(Number);const x=new Date(Date.UTC(y,m-1,d+n));return x.toISOString().slice(0,10);}
function todayIstanbul(){return new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/Istanbul",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());}
function renderDays(){
  const today=todayIstanbul();
  const days=[...Array(GUN_SAYISI)].map((_,i)=>{const iso=addDays(FESTIVAL_BASLANGIC,i);return {i,iso,count:DATA.filter(r=>r.d===iso).length};});
  const cap=GUNLUK_HEDEF||Math.max(1,...days.map(x=>x.count));
  document.getElementById("days").innerHTML=days.map(x=>{
    const st = today<x.iso ? ["waiting","s-wait","Başlamadı"] : today===x.iso ? ["live","s-live","Başladı"] : ["done","s-done","Tamamlandı"];
    const h = st[0]==="waiting" ? 0 : Math.min(100,x.count/cap*100);
    return `<div class="day ${st[0]}">
      <div class="cnt">${st[0]==="waiting"?"":fmt(x.count)}</div>
      <div class="tank" role="img" aria-label="${x.i+1}. gün: ${x.count} oyuncu"><div class="fill" style="height:${h}%"></div></div>
      <div class="name">${x.i+1}. Gün</div><div class="date">${trDate(x.iso,true)}</div>
      <span class="status ${st[1]}">${st[2]}</span></div>`;
  }).join("");
}
renderDays(); setInterval(renderDays,60000);

// Hourly grouped bars
(function(){
  const W=720, H=260, pb=30, pt=22, pl=34, n=hours.length, gw=(W-pl)/n, bw=Math.min(26,gw*.3);
  const max=Math.max(...hc[0],...hc[1]), tick=Math.ceil(max/10)*10;
  const y=v=>H-pb-(v/tick)*(H-pb-pt);
  let s=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Saatlere göre oyuncu sayısı">`;
  for(let v=0; v<=tick; v+=tick/5){
    s+=`<line x1="${pl}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="${v?'#EDF2EF':'#C9D5CE'}"/>`;
    s+=`<text x="${pl-8}" y="${y(v)+4}" text-anchor="end">${v}</text>`;
  }
  hours.forEach((h,i)=>{
    const cx=pl+i*gw+gw/2;
    [0,1].forEach(g=>{
      const v=hc[g][i], x=cx+(g?2:-bw-2);
      s+=`<rect x="${x}" y="${y(v)}" width="${bw}" height="${H-pb-y(v)}" fill="${COLORS[g]}"><title>${h}:00 ${GAMES[g]}: ${v} oyuncu</title></rect>`;
      s+=`<text class="val" x="${x+bw/2}" y="${y(v)-6}" text-anchor="middle">${v}</text>`;
    });
    s+=`<text x="${cx}" y="${H-8}" text-anchor="middle">${h}:00</text>`;
  });
  s+=`</svg>`;
  document.getElementById("hours").innerHTML=s;
  document.getElementById("hoursNote").textContent=`Tüm günlerin saatlik toplamı.`;
})();

// Game split
(function(){
  const pct = byGame.map(r => Math.round(r.length/DATA.length*100));
  let s=`<div class="split">${[0,1].map(g=>`<span style="width:${byGame[g].length/DATA.length*100}%;background:${COLORS[g]}"></span>`).join("")}</div>
  <div class="split-labels"><span>Bilgi Bizde %${pct[0]}</span><span>Bir Bak, Bir Hatırla %${pct[1]}</span></div>
  <table class="gtable"><thead><tr><th>Oyun</th><th>Oyuncu</th><th>Yoğun saat</th></tr></thead><tbody>`;
  [0,1].forEach(g=>{
    const pk=hc[g].indexOf(Math.max(...hc[g]));
    s+=`<tr><td><span class="sw" style="background:${COLORS[g]}"></span>${GAMES[g]}</td><td>${fmt(byGame[g].length)}</td><td>${hours[pk]}:00</td></tr>`;
  });
  s+=`</tbody></table>`;
  document.getElementById("games").innerHTML=s;
})();

// Records
let filter="all", q="";
const norm = s => s.toLocaleLowerCase("tr-TR");
const tel = p => p && p.length===10 ? `0${p.slice(0,3)} ${p.slice(3,6)} ${p.slice(6,8)} ${p.slice(8)}` : (p||"");
function render(){
  const rows=[...DATA].reverse().filter(r=>(filter==="all"||r.g===+filter)&&(!q||norm(r.n).includes(q)||r.ph.includes(q.replace(/\D/g,"")||"~")));
  document.getElementById("rows").innerHTML = rows.length
    ? rows.map(r=>`<tr><td class="num">${trDate(r.d,true)}, ${r.t}</td><td>${esc(r.n)}</td><td>${tel(r.ph)}</td><td><span class="sw" style="background:${COLORS[r.g]}"></span>${GAMES[r.g]}</td></tr>`).join("")
    : `<tr><td colspan="4" class="empty">Aramayla eşleşen kayıt bulunamadı.</td></tr>`;
  document.getElementById("count").textContent = `${fmt(rows.length)} kayıt listeleniyor`;
}
document.querySelectorAll(".seg button").forEach(b=>b.addEventListener("click",()=>{
  filter=b.dataset.f; document.querySelectorAll(".seg button").forEach(x=>x.setAttribute("aria-pressed",x===b)); render();
}));
document.getElementById("q").addEventListener("input",e=>{q=norm(e.target.value.trim()); render();});
render();
</script>
</body>
</html>
